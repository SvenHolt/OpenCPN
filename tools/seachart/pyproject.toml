[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seachart"
version = "1.0.0"
description = "Offline OpenSeaMap charts (S-57) for OpenCPN, built along a route"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
dependencies = ["numpy>=1.20", "shapely>=2.0"]

[project.optional-dependencies]
pbf = ["osmium>=3.6"]

[project.scripts]
seachart = "seachart.cli:main"

[tool.setuptools]
packages = ["seachart"]
